name: Restore Version
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to restore (pick one)'
        required: true
        type: choice
        options:
          - restore-complete
          - restore-ok-autoplay
          - restore-autoplay
          - restore-current-live
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          path: restore
      - name: Restore site files (keeps .github)
        run: |
          cd main
          git config user.name "Jarvis-27"
          git config user.email "jarvis@askmorpheus247.com"
          # copy everything from the restore point except .github
          for f in $(cd ../restore && git ls-files | grep -v '^\.github/'); do
            mkdir -p "$(dirname "$f")"
            cp "../restore/$f" "$f"
          done
          # remove files that are not in the restore point (except .github)
          for f in $(git ls-files | grep -v '^\.github/'); do
            if ! (cd ../restore && git ls-files | grep -qx "$f"); then
              git rm -q "$f"
            fi
          done
          git add -A
          git commit -m "Restore ${{ inputs.version }} via restore button" || echo "nothing to commit"
          git push origin HEAD:main
